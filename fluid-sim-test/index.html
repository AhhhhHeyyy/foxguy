<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>水墨流體模擬</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
canvas { display: block; width: 100%; height: 100%; }
#hint {
  position: fixed; bottom: 18px; left: 50%;
  transform: translateX(-50%);
  font: 13px/1 sans-serif;
  color: rgba(100, 80, 60, 0.45);
  pointer-events: none;
  white-space: nowrap;
}
#err {
  position: fixed; inset: 0; display: flex; align-items: center;
  justify-content: center; background: #fff;
  font: 16px sans-serif; color: #c00; display: none;
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">拖曳滑鼠注入墨水 · 點擊單次潑灑</div>
<div id="err"></div>

<script>
'use strict'

// ─── WebGL2 init ─────────────────────────────────────────────────────────────
const canvas = document.getElementById('c')
const gl = canvas.getContext('webgl2', { alpha: false, antialias: false, depth: false })

function showErr(msg) {
  const el = document.getElementById('err')
  el.textContent = msg; el.style.display = 'flex'
}
if (!gl) { showErr('需要 WebGL2 瀏覽器（Chrome / Firefox / Edge）'); throw 0 }
if (!gl.getExtension('EXT_color_buffer_float'))
  { showErr('GPU 不支援浮點數 framebuffer（EXT_color_buffer_float）'); throw 0 }

const LINEAR = gl.getExtension('OES_texture_float_linear') ? gl.LINEAR : gl.NEAREST

function resize() {
  canvas.width  = canvas.clientWidth
  canvas.height = canvas.clientHeight
}
resize()
window.addEventListener('resize', () => { resize() })

// ─── Simulation config ───────────────────────────────────────────────────────
const CFG = {
  SIM:               256,    // velocity / pressure grid
  DYE:               1024,   // ink density grid (higher = finer detail)
  INK_DISSIPATION:   0.999,  // 接近 1 = 墨水保留越久
  VEL_DISSIPATION:   0.98,
  PRESSURE_ITER:     20,
  CURL:              28,     // 旋度強化，越高越捲曲
  SPLAT_RADIUS:      3e-4,   // Gaussian 半徑
  SPLAT_FORCE:       5000,
}

// ─── GLSL sources ────────────────────────────────────────────────────────────
const VERT = `#version 300 es
precision highp float;
layout(location=0) in vec2 aPos;
out vec2 vUv;
void main(){
  vUv = aPos * 0.5 + 0.5;
  gl_Position = vec4(aPos, 0.0, 1.0);
}`

// Semi-Lagrangian advection
const ADVECT = `#version 300 es
precision highp float;
precision highp sampler2D;
in vec2 vUv;
uniform sampler2D uVelocity;
uniform sampler2D uSource;
uniform vec2  uVelTexel;   // 1 / velocity_resolution
uniform float uDt;
uniform float uDiss;
out vec4 fragColor;
void main(){
  vec2 vel     = texture(uVelocity, vUv).xy;
  vec2 prevUv  = vUv - uDt * vel * uVelTexel;
  fragColor    = uDiss * texture(uSource, prevUv);
}`

// Curl (vorticity magnitude)
const CURL = `#version 300 es
precision mediump float;
precision mediump sampler2D;
in vec2 vUv;
uniform sampler2D uVelocity;
uniform vec2 uTexel;
out vec4 fragColor;
void main(){
  float L = texture(uVelocity, vUv - vec2(uTexel.x, 0.0)).y;
  float R = texture(uVelocity, vUv + vec2(uTexel.x, 0.0)).y;
  float T = texture(uVelocity, vUv + vec2(0.0, uTexel.y)).x;
  float B = texture(uVelocity, vUv - vec2(0.0, uTexel.y)).x;
  fragColor = vec4((R - L - T + B) * 0.5, 0.0, 0.0, 1.0);
}`

// Vorticity confinement  — amplifies existing swirls
const VORTICITY = `#version 300 es
precision highp float;
precision highp sampler2D;
in vec2 vUv;
uniform sampler2D uVelocity;
uniform sampler2D uCurl;
uniform vec2  uTexel;
uniform float uCurlStr;
uniform float uDt;
out vec4 fragColor;
void main(){
  float L = abs(texture(uCurl, vUv - vec2(uTexel.x, 0.0)).x);
  float R = abs(texture(uCurl, vUv + vec2(uTexel.x, 0.0)).x);
  float T = abs(texture(uCurl, vUv + vec2(0.0, uTexel.y)).x);
  float B = abs(texture(uCurl, vUv - vec2(0.0, uTexel.y)).x);
  float C =     texture(uCurl, vUv).x;
  vec2 force = normalize(vec2(T - B, R - L) + 1e-5) * uCurlStr * C;
  force.y *= -1.0;
  vec2 vel   = texture(uVelocity, vUv).xy + force * uDt;
  fragColor  = vec4(vel, 0.0, 1.0);
}`

// Divergence of velocity field
const DIVERGENCE = `#version 300 es
precision mediump float;
precision mediump sampler2D;
in vec2 vUv;
uniform sampler2D uVelocity;
uniform vec2 uTexel;
out vec4 fragColor;
void main(){
  float L = texture(uVelocity, vUv - vec2(uTexel.x, 0.0)).x;
  float R = texture(uVelocity, vUv + vec2(uTexel.x, 0.0)).x;
  float T = texture(uVelocity, vUv + vec2(0.0, uTexel.y)).y;
  float B = texture(uVelocity, vUv - vec2(0.0, uTexel.y)).y;
  fragColor = vec4(0.5 * (R - L + T - B), 0.0, 0.0, 1.0);
}`

// Jacobi pressure solver  (run 20 iterations per frame)
const PRESSURE = `#version 300 es
precision mediump float;
precision mediump sampler2D;
in vec2 vUv;
uniform sampler2D uPressure;
uniform sampler2D uDivergence;
uniform vec2 uTexel;
out vec4 fragColor;
void main(){
  float L   = texture(uPressure, vUv - vec2(uTexel.x, 0.0)).x;
  float R   = texture(uPressure, vUv + vec2(uTexel.x, 0.0)).x;
  float T   = texture(uPressure, vUv + vec2(0.0, uTexel.y)).x;
  float B   = texture(uPressure, vUv - vec2(0.0, uTexel.y)).x;
  float div = texture(uDivergence, vUv).x;
  fragColor = vec4((L + R + T + B - div) * 0.25, 0.0, 0.0, 1.0);
}`

// Subtract pressure gradient  → makes velocity divergence-free
const GRADIENT = `#version 300 es
precision highp float;
precision highp sampler2D;
in vec2 vUv;
uniform sampler2D uPressure;
uniform sampler2D uVelocity;
uniform vec2 uTexel;
out vec4 fragColor;
void main(){
  float L = texture(uPressure, vUv - vec2(uTexel.x, 0.0)).x;
  float R = texture(uPressure, vUv + vec2(uTexel.x, 0.0)).x;
  float T = texture(uPressure, vUv + vec2(0.0, uTexel.y)).x;
  float B = texture(uPressure, vUv - vec2(0.0, uTexel.y)).x;
  vec2 vel = texture(uVelocity, vUv).xy - 0.5 * vec2(R - L, T - B);
  fragColor = vec4(vel, 0.0, 1.0);
}`

// Gaussian force / ink injection
const SPLAT = `#version 300 es
precision highp float;
precision highp sampler2D;
in vec2 vUv;
uniform sampler2D uTarget;
uniform vec2  uPoint;
uniform vec3  uColor;
uniform float uRadius;
uniform float uAspect;
out vec4 fragColor;
void main(){
  vec2 p = vUv - uPoint;
  p.x   *= uAspect;
  float g = exp(-dot(p, p) / uRadius);
  vec3  c = texture(uTarget, vUv).rgb + g * uColor;
  fragColor = vec4(c, 1.0);
}`

// Final display  — ink density → paper + ink colour
const DISPLAY = `#version 300 es
precision highp float;
precision highp sampler2D;
in vec2 vUv;
uniform sampler2D uDensity;
out vec4 fragColor;
void main(){
  float d = clamp(texture(uDensity, vUv).r * 1.4, 0.0, 1.0);
  // slight gamma for richer blacks at low density
  d = pow(d, 0.55);
  // warm paper, near-black ink
  vec3 paper = vec3(0.965, 0.950, 0.920);
  vec3 ink   = vec3(0.04,  0.035, 0.05);
  fragColor  = vec4(mix(paper, ink, d), 1.0);
}`

// ─── GL helpers ──────────────────────────────────────────────────────────────
function compile(type, src) {
  const s = gl.createShader(type)
  gl.shaderSource(s, src)
  gl.compileShader(s)
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
    throw new Error(gl.getShaderInfoLog(s) + '\n---\n' + src)
  return s
}

function mkProgram(fragSrc) {
  const prog = gl.createProgram()
  gl.attachShader(prog, compile(gl.VERTEX_SHADER,   VERT))
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fragSrc))
  gl.linkProgram(prog)
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS))
    throw new Error(gl.getProgramInfoLog(prog))
  const u = {}
  const n = gl.getProgramParameter(prog, gl.ACTIVE_UNIFORMS)
  for (let i = 0; i < n; i++) {
    const name = gl.getActiveUniform(prog, i).name
    u[name] = gl.getUniformLocation(prog, name)
  }
  return { prog, u }
}

function mkFBO(w, h) {
  const tex = gl.createTexture()
  gl.bindTexture(gl.TEXTURE_2D, tex)
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, LINEAR)
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, LINEAR)
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE)
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE)
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null)

  const fb = gl.createFramebuffer()
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb)
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0)
  gl.viewport(0, 0, w, h)
  gl.clearColor(0, 0, 0, 1)
  gl.clear(gl.COLOR_BUFFER_BIT)

  return {
    tex, fb, w, h,
    tx: 1 / w,   // texel size X
    ty: 1 / h,   // texel size Y
    bind(unit) {
      gl.activeTexture(gl.TEXTURE0 + unit)
      gl.bindTexture(gl.TEXTURE_2D, tex)
      return unit
    }
  }
}

// Two FBOs that alternate as read / write each step
class PingPong {
  constructor(w, h) {
    this.a = mkFBO(w, h)
    this.b = mkFBO(w, h)
    this.r = this.a   // read
    this.w = this.b   // write
  }
  swap() { const t = this.r; this.r = this.w; this.w = t }
}

// Full-screen quad
const vao = gl.createVertexArray()
gl.bindVertexArray(vao)
const vbuf = gl.createBuffer()
gl.bindBuffer(gl.ARRAY_BUFFER, vbuf)
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW)
gl.enableVertexAttribArray(0)
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0)

function blit(fbo) {
  if (fbo) {
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo.fb)
    gl.viewport(0, 0, fbo.w, fbo.h)
  } else {
    gl.bindFramebuffer(gl.FRAMEBUFFER, null)
    gl.viewport(0, 0, canvas.width, canvas.height)
  }
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4)
}

// ─── Build programs ───────────────────────────────────────────────────────────
const P = {
  advect:    mkProgram(ADVECT),
  curl:      mkProgram(CURL),
  vorticity: mkProgram(VORTICITY),
  divergence:mkProgram(DIVERGENCE),
  pressure:  mkProgram(PRESSURE),
  gradient:  mkProgram(GRADIENT),
  splat:     mkProgram(SPLAT),
  display:   mkProgram(DISPLAY),
}

// ─── FBO allocation ──────────────────────────────────────────────────────────
const S = CFG.SIM, D = CFG.DYE
const velocity  = new PingPong(S, S)
const density   = new PingPong(D, D)
const pressure  = new PingPong(S, S)
const curlFBO   = mkFBO(S, S)
const divFBO    = mkFBO(S, S)

// ─── Splat (inject ink + velocity) ───────────────────────────────────────────
function splat(nx, ny, dvx, dvy) {
  const aspect = canvas.width / canvas.height
  const { prog, u } = P.splat
  gl.useProgram(prog)
  gl.uniform2f(u.uPoint, nx, ny)
  gl.uniform1f(u.uAspect, aspect)
  gl.uniform1f(u.uRadius, CFG.SPLAT_RADIUS)

  // velocity splat
  gl.uniform1i(u.uTarget, velocity.r.bind(0))
  gl.uniform3f(u.uColor, dvx * CFG.SPLAT_FORCE, dvy * CFG.SPLAT_FORCE, 0)
  blit(velocity.w); velocity.swap()

  // ink density splat
  gl.uniform1i(u.uTarget, density.r.bind(0))
  gl.uniform3f(u.uColor, 1.0, 1.0, 1.0)
  blit(density.w); density.swap()
}

// ─── Simulation step ─────────────────────────────────────────────────────────
function step(dt) {
  const tx = velocity.r.tx, ty = velocity.r.ty

  // 1. Curl  (vorticity magnitude field)
  {
    const { prog, u } = P.curl
    gl.useProgram(prog)
    gl.uniform1i(u.uVelocity, velocity.r.bind(0))
    gl.uniform2f(u.uTexel, tx, ty)
    blit(curlFBO)
  }

  // 2. Vorticity confinement  (amplify swirls → more ink-like curls)
  {
    const { prog, u } = P.vorticity
    gl.useProgram(prog)
    gl.uniform1i(u.uVelocity, velocity.r.bind(0))
    gl.uniform1i(u.uCurl,     curlFBO.bind(1))
    gl.uniform2f(u.uTexel, tx, ty)
    gl.uniform1f(u.uCurlStr, CFG.CURL)
    gl.uniform1f(u.uDt, dt)
    blit(velocity.w); velocity.swap()
  }

  // 3. Divergence
  {
    const { prog, u } = P.divergence
    gl.useProgram(prog)
    gl.uniform1i(u.uVelocity, velocity.r.bind(0))
    gl.uniform2f(u.uTexel, tx, ty)
    blit(divFBO)
  }

  // 4. Pressure Jacobi  (20 iterations)
  {
    const { prog, u } = P.pressure
    gl.useProgram(prog)
    gl.uniform2f(u.uTexel, tx, ty)
    gl.uniform1i(u.uDivergence, divFBO.bind(0))
    for (let i = 0; i < CFG.PRESSURE_ITER; i++) {
      gl.uniform1i(u.uPressure, pressure.r.bind(1))
      blit(pressure.w); pressure.swap()
    }
  }

  // 5. Subtract pressure gradient  (enforce incompressibility)
  {
    const { prog, u } = P.gradient
    gl.useProgram(prog)
    gl.uniform2f(u.uTexel, tx, ty)
    gl.uniform1i(u.uPressure, pressure.r.bind(0))
    gl.uniform1i(u.uVelocity, velocity.r.bind(1))
    blit(velocity.w); velocity.swap()
  }

  // 6. Advect velocity (self-advection)
  {
    const { prog, u } = P.advect
    gl.useProgram(prog)
    gl.uniform2f(u.uVelTexel, tx, ty)
    gl.uniform1f(u.uDt,   dt)
    gl.uniform1f(u.uDiss, CFG.VEL_DISSIPATION)
    gl.uniform1i(u.uVelocity, velocity.r.bind(0))
    gl.uniform1i(u.uSource,   velocity.r.bind(0))  // self-advect
    blit(velocity.w); velocity.swap()
  }

  // 7. Advect density (ink follows velocity)
  {
    const { prog, u } = P.advect
    // prog already active, just update changed uniforms
    gl.uniform1f(u.uDiss, CFG.INK_DISSIPATION)
    gl.uniform1i(u.uVelocity, velocity.r.bind(0))
    gl.uniform1i(u.uSource,   density.r.bind(1))
    blit(density.w); density.swap()
  }
}

// ─── Render to screen ────────────────────────────────────────────────────────
function render() {
  const { prog, u } = P.display
  gl.useProgram(prog)
  gl.uniform1i(u.uDensity, density.r.bind(0))
  blit(null)
}

// ─── Input ───────────────────────────────────────────────────────────────────
const mouse = { down: false, x: 0.5, y: 0.5, px: 0.5, py: 0.5 }

function toUV(clientX, clientY) {
  return {
    x: clientX / canvas.clientWidth,
    y: 1 - clientY / canvas.clientHeight,
  }
}

canvas.addEventListener('mousedown', e => {
  mouse.down = true
  const { x, y } = toUV(e.clientX, e.clientY)
  mouse.x = mouse.px = x
  mouse.y = mouse.py = y
})
canvas.addEventListener('mousemove', e => {
  if (!mouse.down) return
  mouse.px = mouse.x; mouse.py = mouse.y
  const { x, y } = toUV(e.clientX, e.clientY)
  mouse.x = x; mouse.y = y
})
canvas.addEventListener('mouseup',    () => mouse.down = false)
canvas.addEventListener('mouseleave', () => mouse.down = false)

canvas.addEventListener('touchstart', e => {
  e.preventDefault()
  mouse.down = true
  const t = e.touches[0]
  const { x, y } = toUV(t.clientX, t.clientY)
  mouse.x = mouse.px = x; mouse.y = mouse.py = y
}, { passive: false })
canvas.addEventListener('touchmove', e => {
  e.preventDefault()
  if (!mouse.down) return
  mouse.px = mouse.x; mouse.py = mouse.y
  const t = e.touches[0]
  const { x, y } = toUV(t.clientX, t.clientY)
  mouse.x = x; mouse.y = y
}, { passive: false })
canvas.addEventListener('touchend', () => mouse.down = false, { passive: false })

// ─── Auto demo splats ─────────────────────────────────────────────────────────
// Five ink drops that orbit independently — creates organic swirling patterns
const drops = Array.from({ length: 5 }, (_, i) => ({
  phase:  (i / 5) * Math.PI * 2,
  speed:  0.25 + i * 0.08,
  radius: 0.12 + i * 0.03,
  cx:     0.35 + (i % 3) * 0.15,
  cy:     0.35 + Math.floor(i / 3) * 0.25,
}))

let autoTimer = -999
function autoSplat(t) {
  if (mouse.down) return
  if (t - autoTimer < 0.6) return
  autoTimer = t

  // pick a random drop
  const d = drops[Math.floor(Math.random() * drops.length)]
  const angle = t * d.speed + d.phase
  const nx    = d.cx + d.radius * Math.cos(angle)
  const ny    = d.cy + d.radius * Math.sin(angle * 0.7)
  const dvx   = -Math.sin(angle) * d.speed * d.radius * 0.5
  const dvy   =  Math.cos(angle * 0.7) * d.speed * d.radius * 0.5
  splat(nx, ny, dvx, dvy)
}

// Initial drops so screen isn't blank
;[0.3, 0.5, 0.7].forEach((x, i) => {
  const angle = (i / 3) * Math.PI * 2
  splat(x, 0.45 + i * 0.08, Math.cos(angle) * 0.04, Math.sin(angle) * 0.04)
})

// ─── Main loop ────────────────────────────────────────────────────────────────
let lastT = 0
function loop(t) {
  requestAnimationFrame(loop)
  const dt = Math.min((t - lastT) * 0.001, 0.033)
  lastT = t

  if (mouse.down) {
    const dx = mouse.x - mouse.px
    const dy = mouse.y - mouse.py
    if (Math.abs(dx) + Math.abs(dy) > 2e-4)
      splat(mouse.x, mouse.y, dx * 12, dy * 12)
  }

  autoSplat(t * 0.001)
  step(dt)
  render()
}
requestAnimationFrame(loop)
</script>
</body>
</html>
